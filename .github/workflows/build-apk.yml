name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GhostMatch3-v0.18.0.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostMatch3-Android-APK
          path: GhostMatch3-v0.18.0.apk

      - name: Publish test release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.18.0
          name: Ghost Match 3 - Test Version 0.18.0
          artifacts: GhostMatch3-v0.18.0.apk
          allowUpdates: true
          replacesArtifacts: true
          body: |
            Completed targets now show a green check while every objective remains visible. The star meter follows score, and a first three-star clear grants two extra magic boosters. Ghosts are larger, board frames change by level theme, and matching four ghosts in a 2x2 square creates a new four-direction rocket with cinematic trails and four simultaneous impacts. Test-only Google AdMob interstitials use SAMPLE IDs and generate no revenue.
            Download GhostMatch3-v0.18.0.apk and install it on an Android phone.
