name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GhostMatch3-v0.23.0.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostMatch3-Android-APK
          path: GhostMatch3-v0.23.0.apk

      - name: Publish test release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.23.0
          name: Ghost Match 3 - Test Version 0.23.0
          artifacts: GhostMatch3-v0.23.0.apk
          allowUpdates: true
          replacesArtifacts: true
          body: |
            Living stage-map update: ordinary stages now show procedurally varied ghost guardians with crowns, horns, wizard hats, halos, wings and magical jewels. Every third stage is a hand-drawn glowing treasure chest, every twelfth stage is a crowned world guardian, and locked stages hide their identity behind a mystery silhouette. Includes Thai kanok board frames and real milestone booster rewards. Test-only Google AdMob interstitials use SAMPLE IDs and generate no revenue.
            Download GhostMatch3-v0.23.0.apk and install it on an Android phone.
