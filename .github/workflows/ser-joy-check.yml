name: Ser Joy build and device checks
on:
  push:
    branches: [fix/serjoy-ad-resume, feature/serjoy-story-scenes, main, feature/ser-joy-quiz, feature/serjoy-swipe-audio, fix/serjoy-real-match3, feature/serjoy-comedy-polish]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test game rules
        run: |
          python3 tests/check-content.py
          javac -d /tmp/joy-tests app/src/main/java/com/sunantongsan/ghostmatch3/{AdventureEngine,QuizProgress,CharacterAnimation,AudioShuffle}.java tests/{AdventureEngineTest,QuizProgressTest,BreakBoardTest,AudioShuffleTest}.java
          java -cp /tmp/joy-tests com.sunantongsan.ghostmatch3.AdventureEngineTest
          java -cp /tmp/joy-tests com.sunantongsan.ghostmatch3.QuizProgressTest
          java -cp /tmp/joy-tests com.sunantongsan.ghostmatch3.BreakBoardTest
          java -cp /tmp/joy-tests com.sunantongsan.ghostmatch3.AudioShuffleTest
      - name: Build and lint
        run: gradle :app:assembleStoryPreview :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:bundleRelease :app:lintRelease --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tests/run-device.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SerJoy-0.52.0-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            smoke-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SerJoy-0.52.0-review
          path: |
            screenshots/audit-before-31.png
            screenshots/audit-before-32.png
            screenshots/audit-before-35.png
            screenshots/audit-before-51.png
            screenshots/library-explanation.png
            screenshots/toyota-explanation.png
            screenshots/basket-explanation.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SerJoy-0.52.0-test
          path: |
            app/build/outputs/apk/storyPreview/app-storyPreview.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
            screenshots/
            serjoy-animation.mp4
            smoke-result.txt
            app/build/reports/lint-results-debug.html
