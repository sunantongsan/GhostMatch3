name: Ser Joy build and device checks
on:
  push:
    branches: [feature/ser-joy-quiz]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test game rules
        run: |
          javac -d /tmp/joy-tests app/src/main/java/com/sunantongsan/ghostmatch3/{AdventureEngine,QuizProgress}.java tests/{AdventureEngineTest,QuizProgressTest}.java
          java -cp /tmp/joy-tests com.sunantongsan.ghostmatch3.AdventureEngineTest
          java -cp /tmp/joy-tests com.sunantongsan.ghostmatch3.QuizProgressTest
      - name: Build and lint
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.sunantongsan.ghostmatch3.test/com.sunantongsan.ghostmatch3.SerJoySmoke | tee smoke-result.txt
            grep 'PASS: quiz screens' smoke-result.txt
            adb pull /sdcard/Android/data/com.sunantongsan.ghostmatch3/files/screenshots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SerJoy-0.42.0-test
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            screenshots/
            smoke-result.txt
            app/build/reports/lint-results-debug.html
